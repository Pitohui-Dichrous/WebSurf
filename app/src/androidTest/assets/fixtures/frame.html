<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin"><title>WebSurf 嵌入视频</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font-family:system-ui,sans-serif;color:#272637;background:#edf0eb}video{width:100%;max-height:216px;aspect-ratio:16/9;background:#201d2c;display:block;border-radius:8px}button{width:100%;min-height:48px;border:0;border-radius:8px;margin-top:8px;font:14px system-ui;background:#145f39;color:white}
</style>
<video id="frame-video" controls playsinline preload="metadata" src="/protected/sample-360.mp4?slot=embedded"></video>
<button id="frame-play">播放嵌入视频</button>
<script>
window.__frameFixture={instance:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),trustedClicks:0};
document.getElementById('frame-play').onclick=event=>{
  if(event.isTrusted)window.__frameFixture.trustedClicks++;
  document.getElementById('frame-video').play().catch(error=>{window.__frameFixture.error=error.name});
};
</script></html>
