plugins { id 'com.android.application' }
// One release identity for Android metadata, BuildConfig and the release packager.
def appVersion = new Properties()
rootProject.file('version.properties').withReader('UTF-8') { appVersion.load(it) }
def releaseBase = appVersion.getProperty('base')
def releaseChannel = appVersion.getProperty('channel')
def releaseSequence = appVersion.getProperty('sequence')?.toInteger()
def releaseCode = appVersion.getProperty('code')?.toInteger()
if (!(releaseBase ==~ /\d+\.\d+\.\d+/) || !(releaseChannel ==~ /[a-z][a-z0-9-]*/) ||
        releaseCode == null || releaseCode < 1 || releaseSequence == null ||
        (releaseChannel == 'main' ? releaseSequence != 0 : releaseSequence < 1)) {
    throw new GradleException('Invalid version.properties. Use python scripts/version.py prepare.')
}
def releaseName = "${releaseBase}-${releaseChannel}" + (releaseChannel == 'main' ? '' : ".${releaseSequence}")
// A source ZIP or detached tag retains its recorded identity; an active branch must match.
if (rootProject.file('.git').exists()) {
    def branchProcess = ['git', '-C', rootProject.projectDir.absolutePath, 'symbolic-ref', '--short', '-q', 'HEAD'].execute()
    def activeBranch = branchProcess.inputStream.getText('UTF-8').trim()
    branchProcess.waitFor()
    if (branchProcess.exitValue() == 0) {
        def expectedChannel = activeBranch in ['main', 'master'] ? 'main' :
                activeBranch == '酸性设计' ? 'acid' :
                activeBranch == appVersion.getProperty('branch') ? releaseChannel : null
        if (expectedChannel != releaseChannel) {
            throw new GradleException('Version channel does not match this branch. On a preview run python scripts/version.py prepare --branch; on main choose --patch / --minor / --version.')
        }
    }
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('.tools/signing/release.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
android {
    namespace 'io.websurf.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.websurf.app'
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName releaseName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (releasePropertiesFile.exists()) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            crunchPngs false
            if (releasePropertiesFile.exists()) signingConfig signingConfigs.localRelease
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
    buildFeatures { buildConfig true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
