plugins { id 'com.android.application' }
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('.tools/signing/release.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
android {
    namespace 'io.websurf.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.websurf.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (releasePropertiesFile.exists()) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (releasePropertiesFile.exists()) signingConfig signingConfigs.localRelease
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
    buildFeatures { buildConfig true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
